//
// Kubernetes KMS v2 API (k8s.io/kms/apis/v2/api.proto), trimmed to the
// subset a plugin must serve. See:
// https://kubernetes.io/docs/tasks/administer-cluster/kms-provider/
syntax = "proto3";

package v2;

// KeyManagementService is the gRPC service kube-apiserver talks to for
// envelope encryption of resources at rest.
service KeyManagementService {
    // Version and health of the plugin.
    rpc Status(StatusRequest) returns (StatusResponse) {}
    // Decrypt a data encryption key (DEK) previously returned by Encrypt.
    rpc Decrypt(DecryptRequest) returns (DecryptResponse) {}
    // Encrypt a DEK generated by kube-apiserver.
    rpc Encrypt(EncryptRequest) returns (EncryptResponse) {}
}

message StatusRequest {}

message StatusResponse {
    // Version of the KMS API: must be "v2".
    string version = 1;
    // "ok" when the plugin can serve Encrypt/Decrypt.
    string healthz = 2;
    // ID of the key currently used for encryption. Must be non-empty
    // before kube-apiserver will use the plugin.
    string key_id = 3;
}

message DecryptRequest {
    // The data to decrypt, as returned by Encrypt.
    bytes ciphertext = 1;
    // Unique identifier for the Encrypt request this data came from.
    string uid = 2;
    // The key_id that the apiserver has recorded for this ciphertext.
    string key_id = 3;
    // Annotations returned by Encrypt.
    map<string, bytes> annotations = 4;
}

message DecryptResponse {
    // The decrypted DEK.
    bytes plaintext = 1;
}

message EncryptRequest {
    // The DEK to encrypt.
    bytes plaintext = 1;
    // Unique identifier for this request.
    string uid = 2;
}

message EncryptResponse {
    // The encrypted DEK.
    bytes ciphertext = 1;
    // ID of the key used for encryption. kube-apiserver stores this and
    // sends it back on Decrypt.
    string key_id = 2;
    // Optional metadata stored with the ciphertext.
    map<string, bytes> annotations = 3;
}
