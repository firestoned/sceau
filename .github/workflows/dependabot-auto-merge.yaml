#
# Dependabot auto-merge.
#
# On every Dependabot pull request, run the build + test gate (`make build`,
# `make test` — sceau has no e2e suite). If it passes:
#   - patch / minor updates  -> enable auto-merge (squash).
#   - SHA-only bumps         -> enable auto-merge (squash). See `Classify`.
#   - approved by a human    -> enable auto-merge (squash). See `Classify`.
#   - major updates          -> leave the PR OPEN and comment, for manual review.
# If the gate fails (or anything errors), nothing is merged — the PR is left
# open with a comment, which is the desired "leave open for me to investigate"
# fallback. This workflow is fail-safe: it can only ever ENABLE a merge on an
# explicit green run; every other path leaves the PR untouched.
#
# ── Prerequisites (repo settings — one-time, not code) ───────────────────────
#   1. Settings > General > "Allow auto-merge"  ......................  ENABLED
#   2. Branch protection on main requires 1 approving review (Scorecard
#      Branch-Protection). The auto-merge job approves the PR itself
#      (github-actions[bot] review) so bot PRs satisfy the rule; human PRs
#      still need a human approval.
#   3. Do NOT enable "Require review from Code Owners" on main. CODEOWNERS is
#      `* @ebourgeois`, so a github-actions[bot] approval would no longer
#      satisfy branch protection and every Dependabot PR would stall waiting
#      for a human — which is exactly what this workflow exists to avoid.
# ─────────────────────────────────────────────────────────────────────────────

name: Dependabot Auto-merge

# `pull_request_review` is a trigger, not just `pull_request`: a held major sat
# open forever because approving it re-ran nothing. Approval is the sign-off
# the hold was waiting for, so it has to be able to wake this workflow up.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

# Top-level read-only (OpenSSF Scorecard Token-Permissions). Jobs that need to
# enable auto-merge or comment declare elevated scopes at the job level. See
# .claude/rules/github-workflows.md.
permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Fetch Dependabot metadata
    # Gate on the PR *author* (who opened it), not github.actor (who triggered
    # the run). github.actor flips to a human the moment anyone merges/rebases/
    # pushes to a Dependabot branch, which would skip this and every downstream
    # job. pull_request.user.login stays 'dependabot[bot]' for the PR's life, so
    # auto-merge keeps working after a maintainer merges main in. For any other
    # author this (and every downstream job) is skipped, so the workflow no-ops
    # on human PRs.
    #
    # On a review event, ignore everything except an approval — a
    # `changes_requested` or `commented` review is not a merge signal.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && (github.event_name != 'pull_request_review'
          || github.event.review.state == 'approved')
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
      dependency-names: ${{ steps.meta.outputs.dependency-names }}
      auto-merge: ${{ steps.classify.outputs.auto-merge }}
    steps:
      - name: Fetch metadata
        id: meta
        # SHA-pinned per repo policy; Dependabot's github-actions updater will
        # keep this current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The single place that decides "may this merge itself?". Both the
      # auto-merge and hold-major jobs branch on this one output so they cannot
      # drift into overlapping or contradictory conditions.
      #
      #   patch / minor  -> yes, unchanged behaviour.
      #
      #   human approval -> yes. A maintainer approving a held PR *is* the
      #                     manual review the hold was waiting for. Before the
      #                     pull_request_review trigger above, approving did
      #                     nothing at all.
      #
      #   SHA-only bump  -> yes. An action pinned to a moving tag with no
      #                     release (google/clusterfuzzlite ships only `v1`)
      #                     can never produce a semver delta, and
      #                     fetch-metadata reports that unknown delta as
      #                     `semver-major`. That is a missing version number,
      #                     not a breaking change, so holding it for "manual
      #                     review of the major" reviews nothing. The build +
      #                     test gate is what actually vets these. Detection is
      #                     deliberately dumb and dependency-free: every semver
      #                     contains a dot, no commit SHA does.
      #
      #                     Trade-off, stated plainly: upstream *could* ship a
      #                     breaking change under a moving tag and this would
      #                     merge it on green. Splitting clusterfuzzlite into
      #                     its own Dependabot group keeps that blast radius to
      #                     the fuzzing workflow.
      #
      #   otherwise      -> no; held for manual review.
      - name: Classify
        id: classify
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          auto=false
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            auto=true
          elif [ "$REVIEW_STATE" = "approved" ]; then
            auto=true
          elif [ -n "$NEW_VERSION" ] && [ "${NEW_VERSION#*.}" = "$NEW_VERSION" ]; then
            auto=true
          fi
          echo "auto-merge=$auto" >> "$GITHUB_OUTPUT"
          echo "update-type=$UPDATE_TYPE new-version=$NEW_VERSION review=${REVIEW_STATE:-none} -> auto-merge=$auto"

  gate:
    name: Build + test gate
    needs: metadata
    # Skipped automatically when `metadata` is skipped (non-Dependabot PR).
    # Tool setup mirrors the build job in build.yaml; logic is Makefile targets
    # per .claude/rules/github-workflows.md.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@d0d51c638a90bffc2a1567fe7af112b37fe8854c # v1.3.7

      - name: Build
        run: make build

      - name: Test
        run: make test

  auto-merge:
    name: Enable auto-merge
    needs: [metadata, gate]
    # success() ensures BOTH metadata and the gate passed before we ever
    # enable a merge. What counts as mergeable is decided once, in `Classify`.
    if: ${{ success() && needs.metadata.outputs.auto-merge == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Branch protection on main requires 1 approving review before merge;
      # without this approval `gh pr merge --auto` would wait forever. The
      # approval is from github-actions[bot], not the PR author, so it counts.
      - name: Approve PR
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "$PR_URL" --approve

      - name: Enable auto-merge (squash)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

  hold-major:
    name: Hold update for review
    needs: [metadata, gate]
    # Gate passed but `Classify` withheld the merge — leave open, tell the
    # reviewer. Exact complement of the auto-merge job's condition.
    if: ${{ success() && needs.metadata.outputs.auto-merge != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment (major held)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "✅ build + test passed, but this is a **major** version update — left open for manual review. **Approving this PR will enable auto-merge.**"

  report-failure:
    name: Report gate failure
    needs: [metadata, gate]
    # Any failure in metadata or the gate. Leaves the PR open and flags it.
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment (gate failed)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "❌ build + test failed — auto-merge withheld. Left open for investigation. See the **Build + test gate** job for logs."
