#
# Documentation pipeline for sceau (MkDocs Material → GitHub Pages).
#
# All business logic lives in the Makefile; jobs here only install tools
# (Python, Poetry via hash-locked requirements) and call make targets.
# Third-party actions are SHA-pinned with a version comment. See
# .claude/rules/github-workflows.md.

name: Documentation

on:
  # push to main — builds AND publishes to GitHub Pages (the deploy job and
  # the Pages steps are gated on `push` + `refs/heads/main`).
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'proto/**'
      - '.github/workflows/docs.yaml'
  # PRs build the site only (strict) to prove it compiles cleanly.
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'proto/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

# Top-level GITHUB_TOKEN is read-only by default (OpenSSF Scorecard
# Token-Permissions rule). The deploy job declares pages:write +
# id-token:write at the job level.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # CALM architecture validation is a hard gate on every docs build: a broken
  # architecture means broken diagrams downstream (ADD rules).
  calm-validate:
    name: 🏛️ Validate CALM Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate CALM model
        run: make calm-validate

  build:
    name: 📚 Build Documentation
    needs: [calm-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Full history for git-revision-date-localized plugin

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        # Hash-locked install: every transitive dep carries sha256 hashes in
        # .github/requirements/poetry.txt (Scorecard Pinned-Dependencies).
        # Bump POETRY_VERSION in .github/requirements/poetry.in and regenerate
        # with:
        #   uv pip compile --python-version 3.11 --python-platform linux --generate-hashes \
        #     --output-file=.github/requirements/poetry.txt .github/requirements/poetry.in
        run: |
          python3 -m pip install --user --require-hashes -r .github/requirements/poetry.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Poetry
        run: |
          cd docs
          poetry config virtualenvs.in-project true

      - name: Cache Poetry dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: docs/.venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('docs/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      # `make docs` regenerates the CALM diagrams (npx @finos/calm-cli; Node
      # is preinstalled on ubuntu runners) and then builds the site with
      # `mkdocs build --strict`, installing the Poetry deps first.
      - name: Build documentation
        run: make docs

      # Pages setup + artifact upload only on a direct push to main. PR runs
      # build the site to prove it compiles cleanly but never produce a
      # deploy artifact.
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    name: 🚀 Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
