#
# Build / test / release pipeline for sceau.
#
# All business logic lives in the Makefile; jobs here only install tools
# (libtss2-dev, protobuf-compiler, the Rust toolchain) and call make targets.
# Composite actions come from firestoned/github-actions (SHA-pinned, v1.3.6);
# third-party actions are SHA-pinned with a version comment. See
# .claude/rules/github-workflows.md and docs/adr/0002.

name: Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'Makefile'
      - 'Dockerfile'
      - 'deny.toml'
      - 'docs/architecture/calm/**'
      - '.github/workflows/build.yaml'
  push:
    branches:
      - main
  release:
    types:
      - published

# Top-level GITHUB_TOKEN is read-only by default (OpenSSF Scorecard
# Token-Permissions rule). Jobs that need elevated scopes — packages:write
# (GHCR push), id-token:write (keyless Cosign), security-events:write
# (SARIF), contents:write (release asset upload) — declare them explicitly
# at the job level. See ADR-0002.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # License headers — always runs (PRs are pre-filtered by path at the trigger).
  # ─────────────────────────────────────────────────────────────────────────────
  license-check:
    name: ⚖️ Verify SPDX License Headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check license headers
        uses: firestoned/github-actions/security/license-check@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          copyright-holder: "Erick Bourgeois, sceau"
          license-id: "Apache-2.0"

  # ─────────────────────────────────────────────────────────────────────────────
  # Commit signatures — verify-mode differs by event type.
  # ─────────────────────────────────────────────────────────────────────────────
  verify-commits:
    name: 🔐 Verify Signed Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify commits (PR)
        if: github.event_name == 'pull_request'
        uses: firestoned/github-actions/security/verify-signed-commits@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: origin/${{ github.base_ref }}
          verify-mode: pr

      - name: Verify commits (push to main)
        if: github.event_name == 'push'
        uses: firestoned/github-actions/security/verify-signed-commits@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: push

      - name: Verify commits (release)
        if: github.event_name == 'release'
        uses: firestoned/github-actions/security/verify-signed-commits@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          verify-mode: release

  # ─────────────────────────────────────────────────────────────────────────────
  # CALM — architecture meta-schema validation is a hard gate (ADD rules).
  # ─────────────────────────────────────────────────────────────────────────────
  calm-validate:
    name: 🏛️ Validate CALM Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate CALM model
        run: make calm-validate

  # ─────────────────────────────────────────────────────────────────────────────
  # Lint — formatting + clippy. Needs the TSS dev libraries to compile.
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: 🎨 Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    needs: [license-check, verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6

      - name: Run lint
        run: make lint

  # ─────────────────────────────────────────────────────────────────────────────
  # Build + test — all events. On release, also generates the CycloneDX SBOM
  # and stages the binary + SBOM as the release artifact.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🦀 Build + Test
    runs-on: ubuntu-24.04
    needs: [lint, calm-validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Generate CycloneDX SBOM (release)
        if: github.event_name == 'release'
        run: make sbom

      - name: Upload binary + SBOM artifact (release)
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sceau-linux-amd64
          path: |
            target/release/sceau
            *.cdx.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Security scan — cargo audit (all events).
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: 🛡️ Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref — re-pin quarterly)

      - name: Run security scan
        uses: firestoned/github-actions/rust/security-scan@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          cargo-audit-version: "0.22.0"

  # ─────────────────────────────────────────────────────────────────────────────
  # cargo-deny — licenses, advisories, sources (PR + push).
  # ─────────────────────────────────────────────────────────────────────────────
  cargo-deny:
    name: 🧪 cargo-deny (License + Advisory + Sources)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    needs: [verify-commits]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17
        with:
          log-level: warn
          command: check

  # ─────────────────────────────────────────────────────────────────────────────
  # Extract version — feeds image tagging downstream.
  # ─────────────────────────────────────────────────────────────────────────────
  extract-version:
    name: 🏷️ Extract Version Information
    runs-on: ubuntu-latest
    needs: [license-check, verify-commits]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag-name }}
      image_tag: ${{ steps.version.outputs.image-tag }}
      short_sha: ${{ steps.version.outputs.short-sha }}
    steps:
      - name: Extract version
        id: version
        uses: firestoned/github-actions/versioning/extract-version@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          repository: ${{ github.repository }}
          workflow-type: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'main' || 'release' }}
          pr-number: ${{ github.event.pull_request.number }}
          release-tag: ${{ github.event.release.tag_name }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker — distroless image from the pre-built binary (see Makefile). Built
  # on every event to validate the Dockerfile; pushed, Trivy-scanned and
  # Cosign-signed only on push-to-main + release so fork PRs never need
  # packages:write. See ADR-0002.
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Image (distroless)
    runs-on: ubuntu-24.04
    needs: [build, extract-version]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker (login + buildx)
        if: github.event_name != 'pull_request'
        uses: firestoned/github-actions/docker/setup-docker@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          IMAGE_TAG: ${{ needs.extract-version.outputs.image_tag }}
        run: make docker-image ARCH=amd64

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ needs.extract-version.outputs.image_tag }}
        run: make docker-push

      - name: Trivy scan
        if: github.event_name != 'pull_request'
        uses: firestoned/github-actions/security/trivy-scan@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.extract-version.outputs.image_tag }}
          exit-code: "0"

      - name: Cosign sign (keyless, by tag)
        if: github.event_name != 'pull_request'
        uses: firestoned/github-actions/security/cosign-sign@53b483254bc648903c364ee3c73a546d0936a91e # v1.3.6
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}
          image-tags: ${{ needs.extract-version.outputs.image_tag }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Release only: attach the binary tarball + SBOM to the GitHub Release.
  # ─────────────────────────────────────────────────────────────────────────────
  upload-release-assets:
    name: 🚀 Upload Release Assets
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
    steps:
      - name: Download binary + SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sceau-linux-amd64
          path: ./artifacts

      - name: Package release assets
        run: |
          chmod +x artifacts/sceau
          tar czf sceau-linux-amd64.tar.gz -C artifacts sceau
          cp artifacts/*.cdx.json . 2>/dev/null || true
          sha256sum sceau-linux-amd64.tar.gz *.cdx.json > checksums.sha256 2>/dev/null || sha256sum sceau-linux-amd64.tar.gz > checksums.sha256
          ls -lh

      - name: Upload release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            sceau-linux-amd64.tar.gz
            *.cdx.json
            checksums.sha256
