#
# Dependency update automation (Scorecard Dependency-Update-Tool). Weekly is
# frequent enough to stay current without drowning a pre-1.0 repo in PR noise.
# Each ecosystem is grouped into a single PR — one CI cycle instead of a
# serialized chain of per-crate / per-action PRs. Auto-merge on green is
# handled by dependabot-auto-merge.yaml. Every ecosystem has a 7-day cooldown
# so freshly published (potentially malicious) releases bake before Dependabot
# proposes them (Semgrep dependabot-missing-cooldown).
version: 2
updates:
  # GitHub Actions — keeps the SHA-pinned actions current.
  #
  # Two groups, not one. google/clusterfuzzlite publishes only a moving `v1`
  # tag — no releases, no semver — so Dependabot can only ever propose a
  # SHA -> SHA bump for it. dependabot/fetch-metadata reports a *group's*
  # update-type as the highest across its members and classifies a
  # version-less SHA bump as `semver-major`, which pinned the entire `actions`
  # group at major from the moment ClusterFuzzLite landed: the auto-merge job
  # was skipped and `hold-major` fired instead (PRs #3 and #8), dragging
  # genuine patch bumps like actions/deploy-pages 5.0.0 -> 5.0.1 along with it.
  #
  # Isolating clusterfuzzlite lets the main `actions` group report an honest
  # update-type again, so patch/minor bumps auto-merge as designed and only
  # real majors (e.g. actions/checkout v6 -> v7) get held.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Declared first: a dependency joins the first group whose patterns it
      # matches. exclude-patterns on `actions` below makes the split hold
      # regardless of evaluation order.
      clusterfuzzlite:
        patterns: ["google/clusterfuzzlite*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["google/clusterfuzzlite*"]

  # Rust workspace — one weekly PR for all crates instead of a PR per crate.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust-dependencies:
        patterns: ["*"]

  # Docs site (Poetry).
  - package-ecosystem: "pip"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Container base images. One entry per directory containing a Dockerfile —
  # Dependabot does not recurse, so `directory: "/"` alone would leave the
  # ClusterFuzzLite builder unwatched.
  #
  # Both Dockerfiles pin their base by digest on a literal `FROM` line, which
  # is the only form this ecosystem parses: it does not expand `ARG` defaults
  # (dependabot/dependabot-core#4597, #10190). Keep it that way.
  #
  # Not covered here, and not coverable: the `container:` image in
  # .github/workflows/sast.yaml. Dependabot has no updater for workflow
  # container images (dependabot/dependabot-core#5819), so that one is pinned
  # by digest with a version comment and refreshed by hand.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      container-base-images:
        patterns: ["*"]
