# The repo root is both a package (the `sceau` binary/library) and the
# workspace root. `crates/sceau-vex` holds the release pipeline's auto-VEX
# tooling — a CI-only tool that must never enter the sceau binary's
# dependency graph, hence a separate member rather than an extra `[[bin]]`
# (ADR-0006).
[workspace]
members = ["crates/sceau-vex"]

[package]
name = "sceau"
version = "0.1.0"
edition = "2021"
description = "Kubernetes KMS v2 plugin that seals DEKs with a TPM 2.0"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
http = "1"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = "4"
prost = "0.14"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rsa = "0.9"
sha2 = "0.11"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tss-esapi = "7.5"
x509-parser = "0.18"

[build-dependencies]
# tonic 0.13 split prost codegen out of tonic-build into tonic-prost-build.
tonic-prost-build = "0.14"

[profile.release]
strip = true
lto = true
codegen-units = 1
